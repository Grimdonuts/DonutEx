[package]
name = "donutex"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
ropey = "1.6"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
rfd = "0.15"
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
